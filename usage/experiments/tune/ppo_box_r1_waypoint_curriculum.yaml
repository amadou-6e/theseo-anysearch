description: >
  Tunes radius-1 box PPO with the discrete-18 action space on stepped terrain.
  Training samples the current waypoint stage 75 percent of the time and
  retained stages 25 percent of the time. Deterministic retention evaluation
  promotes the curriculum only after goal-reaching thresholds pass.

experiment:
  name: ppo-box-r1-discrete18-waypoint-curriculum
  output_dir: runtime/tune
  seed: 42

env:
  agent_count: 1
  max_steps: 200
  seed: 42
  trail_mode: true

  geometry:
    stl_path: usage/geometries/stepped_terrain.stl
    scale: 40.0
    grid_size: 32

  observation:
    mode: box
    box_radius: 1

  action:
    mode: discrete_18

  rewards:
    step_cost: -0.01
    collision_cost: 0.0
    goal_reward: 1.0
    distance_shaping: 0.2
    distance_reward_mode: progress

  waypoint_curriculum:
    enabled: true
    initial_start: [9, 29, 1]
    initial_goal: [6, 7, 1]
    seed: 42
    training_sampling:
      current_stage_probability: 0.75
      retained_stage_probability: 0.25

training:
  algorithm: ppo
  model: fcnet
  runner: local
  iterations: 100
  checkpoint_interval: 10
  require_gpu: true
  num_env_runners: 2
  num_envs_per_env_runner: 4
  num_gpus_per_env_runner: 0.0
  trajectory_every: 10
  best_trajectory: true
  video_every: 0

evaluation:
  episodes: 10
  seed: 142
  min_success_rate: 0.8
  num_env_runners: 0
  waypoint_curriculum:
    enabled: true
    frequency: 1
    stages: all
    episodes: 3
    min_success_rate: 0.8
    min_per_stage_success_rate: 0.67
    advance:
      mode: success
      successes_required: 1

algorithm_config:
  lr: 0.00047613798737828277
  train_batch_size: 4096
  gamma: 0.9784356671807992
  clip_param: 0.14250875942490643
  kl_coeff: 0.18279103186070939
  num_sgd_iter: 10
  minibatch_size: 256
  lambda_: 0.9423692880503198

model_config:
  hidden_sizes: [128, 128, 128, 128]
  activation: relu

tune_config:
  scheduler: asha
  num_samples: 10
  metric: evaluation_success_rate
  mode: max
  max_concurrent: 8
  checkpoint_frequency: 1
  asha_config:
    max_t: 100
    grace_period: 10
    reduction_factor: 2
  search_space:
    algorithm_config:
      lr: {loguniform: [5.0e-5, 5.0e-4]}
      gamma: {uniform: [0.95, 0.99]}
      clip_param: {uniform: [0.1, 0.25]}
      kl_coeff: {uniform: [0.1, 0.3]}
      num_sgd_iter: {choice: [5, 10]}

mlflow:
  tracking_uri: sqlite:///runtime/experiments/mlflow.db
