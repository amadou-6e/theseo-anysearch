description: >
  Runs the expanded 20-trial PPO curriculum search on an obstacle-free grid
  using inverse-success stage sampling and segmented route episodes. A native
  sparse reward gives each reached segment a fresh countdown budget equal to
  twice that segment's exact shortest action-step length.

experiment:
  name: ppo-empty-grid-discrete18-segment-reward-inverse-success
  output_dir: runtime/tune
  seed: 42

env:
  agent_count: 1
  max_steps: 200
  seed: 42
  trail_mode: true

  task:
    max_consecutive_collisions: 10

  geometry:
    grid_size: 32
    boxes: []

  observation:
    mode: box
    box_radius: 1

  action:
    mode: discrete_18

  rewards:
    custom:
      name: segment_countdown_goal
      parameters:
        budget_multiplier: 2.0
        minimum_reward: 1.0

  waypoint_curriculum:
    enabled: true
    completion_mode: continue_route
    initial_start: [16, 16, 16]
    seed: 42
    route_length:
      mode: fraction
      fraction: 0.75
    difficulty:
      mode: segment_distance
      initial_distance: 1
      distance_increment: 2
      maximum_distance: 20
      sampling_attempts: 512
    training_sampling:
      strategy: inverse_success
      minimum_weight: 0.1
      power: 1.0
      unevaluated_success_rate: 0.0

training:
  algorithm: ppo
  model: fcnet
  runner: local
  iterations: 100
  checkpoint_interval: 10
  require_gpu: true
  num_gpus: 0.3333333333333333
  num_env_runners: 6
  num_envs_per_env_runner: 4
  num_gpus_per_env_runner: 0.0
  trajectory_every: 10
  best_trajectory: true
  video_every: 0

evaluation:
  episodes: 10
  seed: 142
  min_success_rate: 0.8
  num_env_runners: 0
  num_envs_per_env_runner: 4
  waypoint_curriculum:
    enabled: true
    frequency: 5
    stages: all
    episodes: 3
    min_success_rate: 0.8
    min_per_stage_success_rate: 0.67
    advance:
      mode: success
      successes_required: 1

algorithm_config:
  lr: 0.00022330606666898814
  train_batch_size: 4096
  gamma: 0.9528847957241926
  clip_param: 0.10943957247666965
  kl_coeff: 0.1124007029997417
  num_sgd_iter: 5
  minibatch_size: 256
  lambda_: 0.9423692880503198

model_config:
  hidden_sizes: [128, 128, 128, 128]
  activation: relu

tune_config:
  scheduler: asha
  num_samples: 20
  metric: evaluation_success_rate
  mode: max
  max_concurrent: 3
  checkpoint_frequency: 10
  asha_config:
    max_t: 100
    grace_period: 10
    reduction_factor: 2
  search_space:
    algorithm_config:
      lr: {loguniform: [2.5e-5, 1.0e-3]}
      gamma: {uniform: [0.90, 0.995]}
      clip_param: {uniform: [0.05, 0.30]}
      kl_coeff: {uniform: [0.03, 0.50]}
      num_sgd_iter: {choice: [3, 5, 10, 15]}
    model_config:
      base_width: {choice: [128, 256, 512, 1024]}
      head_width: {choice: [32, 64, 128, 256]}
      layers_per_width: {choice: [1, 2, 3]}

mlflow:
  tracking_uri: sqlite:///runtime/experiments/mlflow.db
