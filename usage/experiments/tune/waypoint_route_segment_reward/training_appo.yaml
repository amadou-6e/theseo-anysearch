description: >
  Runs APPO on the obstacle-free segmented waypoint curriculum. APPO collects
  rollouts asynchronously, applies V-trace correction for policy lag, and runs
  deterministic AnySearch evaluation concurrently on dedicated RLlib workers.

experiment:
  name: appo-empty-grid-discrete18-segment-reward-initial1
  output_dir: runtime/train
  seed: 42

env:
  agent_count: 1
  max_steps: 96
  seed: 42
  trail_mode: true
  task:
    max_consecutive_collisions: 10
  geometry:
    grid_size: 32
    boxes: []
  observation:
    mode: box
    box_radius: 1
  action:
    mode: discrete_18
  rewards:
    custom:
      name: segment_countdown_goal
      parameters:
        additional_budget: 10.0
        minimum_reward: 1.0
  waypoint_curriculum:
    enabled: true
    completion_mode: continue_route
    initial_start: [16, 16, 16]
    seed: 42
    route_length:
      mode: fixed
      distance: 96
    difficulty:
      mode: segment_distance
      initial_distance: 1
      distance_increment: 2
      maximum_distance: 20
      sampling_attempts: 512
    training_sampling:
      strategy: inverse_success
      minimum_weight: 0.1
      power: 1.0
      unevaluated_success_rate: 0.0

training:
  algorithm: appo
  model: fcnet
  runner: local
  iterations: 1000
  checkpoint_interval: 10
  require_gpu: true
  num_gpus: 0.3333333333333333
  num_env_runners: 5
  num_envs_per_env_runner: 4
  max_requests_in_flight_per_env_runner: 2
  num_gpus_per_env_runner: 0.0
  trajectory_every: 10
  best_trajectory: true
  video_every: 0

evaluation:
  episodes: 10
  seed: 142
  min_success_rate: 0.8
  num_env_runners: 4
  num_envs_per_env_runner: 4
  parallel_to_training: true
  waypoint_curriculum:
    enabled: true
    frequency: 5
    stages: all
    episodes: 3
    min_success_rate: 0.8
    min_per_stage_success_rate: 0.67
    advance:
      mode: success
      successes_required: 1

algorithm_config:
  lr: 3.0e-4
  gamma: 0.99
  train_batch_size: 1024
  rollout_fragment_length: 32
  vtrace: true
  use_gae: true
  lambda_: 1.0
  clip_param: 0.4
  use_kl_loss: false
  kl_coeff: 1.0
  kl_target: 0.01
  target_network_update_freq: 2
  circular_buffer_num_batches: 8
  circular_buffer_iterations_per_batch: 2

model_config:
  hidden_sizes: [128, 128, 128, 128]
  activation: relu

mlflow:
  tracking_uri: sqlite:///runtime/experiments/mlflow.db
