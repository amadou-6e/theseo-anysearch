description: >
  Trains PPO on augmented map crops using three-component vector actions, radial observations, and negative zone rewards. It compares the compact vector action representation with the discrete 26-action baseline.

experiment:
  name: ppo-maps-vector-zones
  output_dir: ../../../runtime/experiments
  seed: 42

env:
  agent_count: 1
  max_steps: 300
  trail_mode: true

  geometry:
    grid_size: 32
    pool:
      pool_dir: ../../../runtime/geometry_pools/preview
      augmentation:
        paste_boxes:
          num_boxes: [1, 4]
          box_min_size: [1, 1, 1]
          box_max_size: [5, 5, 5]
          prob: 0.5

  observation:
    mode: radial

  action:
    mode: vector_3

  rewards:
    goal_reward: 10.0
    collision_cost: -0.5
    distance_reward_mode: zone
    zone_reward_min: -1.0
    zone_reward_max: -0.01
    zone_reward_curve: linear

training:
  algorithm: ppo
  runner: local
  iterations: 100
  checkpoint_interval: 25
  trajectory_every: 10
  best_trajectory: true

algorithm_config:
  lr: 3.0e-4
  train_batch_size: 512
  clip_param: 0.2
  num_sgd_iter: 10
  lambda_: 0.95
  kl_coeff: 0.2
  gamma: 0.99

model_config:
  hidden_sizes: [256, 256]
  activation: relu

mlflow: {}
