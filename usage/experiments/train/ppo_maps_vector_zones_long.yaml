description: >
  Runs the long-duration version of the vector-action maps experiment for 1,000 iterations. It tests whether additional training resolves slow convergence under radial observations and zone rewards.

experiment:
  name: ppo-maps-vector-zones-long
  output_dir: ../../../runtime/experiments
  seed: 42

env:
  obs_mode: radial
  action_mode: vector_3
  agent_count: 1
  max_steps: 300
  trail_mode: true
  goal_reward: 10.0
  collision_cost: -0.5
  grid_size: 32
  distance_reward_mode: zone
  zone_reward_min: -1.0
  zone_reward_max: -0.01
  zone_reward_curve: linear

  geometry_pool:
    pool_dir: ../../../runtime/geometry_pools/preview
    augmentation:
      paste_boxes:
        num_boxes: [1, 4]
        box_min_size: [1, 1, 1]
        box_max_size: [5, 5, 5]
        prob: 0.5

training:
  algorithm: ppo
  runner: local
  iterations: 1000
  checkpoint_interval: 100
  trajectory_every: 5
  best_trajectory: true

algorithm_config:
  lr: 3.0e-4
  train_batch_size: 512
  clip_param: 0.2
  num_sgd_iter: 10
  lambda_: 0.95
  kl_coeff: 0.2
  gamma: 0.99

model_config:
  hidden_sizes: [256, 256]
  activation: relu

mlflow: {}
