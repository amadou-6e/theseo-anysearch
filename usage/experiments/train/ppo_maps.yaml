description: >
  Trains PPO on augmented industrial map crops with radial observations and always-negative progress rewards before the terminal goal bonus. It is the primary discrete-action maps baseline.

experiment:
  name: ppo-maps
  output_dir: ../../../runtime/experiments
  seed: 42

env:
  obs_mode: radial
  agent_count: 1
  max_steps: 300
  trail_mode: true
  step_cost: -0.05       # base cost per step (always applied)
  goal_reward: 10.0      # large terminal reward so it dominates total episode return
  distance_shaping: 0.02 # max per-step shaping = 0.02 * sqrt(3) ≈ 0.035 < 0.05 → always negative
  collision_cost: -0.5   # very negative — strongly discourages blocked moves
  grid_size: 32

  geometry_pool:
    pool_dir: ../../../runtime/geometry_pools/preview   # 98 crops from industrial plant maps
    augmentation:
      paste_boxes:
        num_boxes: [1, 4]
        box_min_size: [1, 1, 1]
        box_max_size: [5, 5, 5]
        prob: 0.5

training:
  algorithm: ppo
  runner: local
  iterations: 100
  checkpoint_interval: 25
  trajectory_every: 10
  best_trajectory: true

algorithm_config:
  lr: 3.0e-4
  train_batch_size: 512
  clip_param: 0.2
  num_sgd_iter: 10
  lambda_: 0.95
  kl_coeff: 0.2
  gamma: 0.99

model_config:
  hidden_sizes: [256, 256]
  activation: relu

mlflow: {}
