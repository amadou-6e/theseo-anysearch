description: >
  Reproduces the successful radius-10 PPO experiment on the legacy scale-40 stepped terrain with fixed waypoints. It checks whether the current evaluation and replay pipeline can recover the previously observed goal-reaching behavior.

experiment:
  name: ppo-box-r10-reproduction
  output_dir: runtime/box_r10_reproduction
  seed: 42

env:
  # Exact legacy scale-40 voxelization of usage/geometries/stepped_terrain.stl.
  geometry_pool:
    pool_dir: ../../geometry_pools/stepped_terrain_legacy_scale40
  waypoints_file: usage/experiments/train/stepped_terrain_legacy_waypoints.json
  grid_size: 32
  agent_count: 1
  max_steps: 200
  seed: 42
  action_mode: discrete_26
  obs_mode: box
  box_radius: 10
  include_voxel_count: true
  trail_mode: true
  step_cost: -0.01
  goal_reward: 1.0
  distance_shaping: 0.2
  collision_cost: 0.0
  distance_reward_mode: progress

training:
  algorithm: ppo
  runner: local
  iterations: 40
  checkpoint_interval: 40
  require_gpu: false
  num_env_runners: 0
  evaluation_episodes: 20
  trajectory_every: 10
  best_trajectory: true
  video_every: 0

algorithm_config:
  lr: 0.0003086224849951691
  train_batch_size: 1024
  gamma: 0.9572096472425815
  clip_param: 0.28373490359151166
  kl_coeff: 0.48272649818019303
  num_sgd_iter: 30
  lambda_: 0.9868706642268987
  minibatch_size: 128

model_config:
  hidden_sizes: [256, 256, 256, 256]
  activation: relu

tune_config:
  scheduler: random
  num_samples: 4
  metric: evaluation_success_rate
  mode: max
  max_concurrent: 2
