description: >
  Tests waypoint-curriculum learning on an empty 32 x 32 x 32 grid. The short
  initial route has no static obstacles, isolating curriculum advancement,
  retained-stage sampling, and vectorized rollout/evaluation behavior.

experiment:
  name: ppo-empty-grid-waypoint-curriculum
  output_dir: runtime/train/empty_grid_waypoint_curriculum_short
  seed: 42

env:
  max_steps: 96
  seed: 42
  agent_count: 1
  trail_mode: true

  task:
    max_consecutive_collisions: 10

  geometry:
    grid_size: 32
    boxes: []

  observation:
    mode: box
    box_radius: 1

  action:
    mode: discrete_18

  rewards:
    step_cost: -0.05
    collision_cost: 0.0
    goal_reward: 1.0
    distance_shaping: 0.05
    distance_reward_mode: progress

  waypoint_curriculum:
    enabled: true
    initial_start: [16, 16, 16]
    initial_goal: [18, 18, 18]
    seed: 42
    difficulty:
      mode: monotonic_distance
      distance_increment: 2.0
      sampling_attempts: 512
    training_sampling:
      current_stage_probability: 0.75
      retained_stage_probability: 0.25

training:
  algorithm: ppo
  model: fcnet
  runner: local
  iterations: 40
  checkpoint_interval: 10
  require_gpu: true
  num_env_runners: 6
  num_envs_per_env_runner: 4
  trajectory_every: 10
  best_trajectory: true
  video_every: 0
evaluation:
  episodes: 10
  seed: 142
  min_success_rate: 0.8
  num_env_runners: 4
  num_envs_per_env_runner: 4
  waypoint_curriculum:
    enabled: true
    frequency: 1
    stages: all
    episodes: 3
    min_success_rate: 0.8
    min_per_stage_success_rate: 0.67
    advance:
      mode: success
      successes_required: 1

algorithm_config:
  lr: 0.00047613798737828277
  train_batch_size: 1024
  gamma: 0.9784356671807992
  clip_param: 0.14250875942490643
  kl_coeff: 0.18279103186070939
  num_sgd_iter: 20
  minibatch_size: 128
  lambda_: 0.9423692880503198

model_config:
  hidden_sizes: [128, 128, 128, 128]
  activation: relu

mlflow:
  tracking_uri: sqlite:///runtime/experiments/mlflow.db
