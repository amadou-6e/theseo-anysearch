description: >
  Bounded imitation-then-PPO smoke on the six-gate compiled world. This is a
  feasibility run, not a preregistered perception-encoder comparison.

experiment:
  name: large-world-six-gate-imitation-smoke
  output_dir: ../../../../runtime/train/large_world_six_gate_imitation_smoke
  seed: 42

env:
  agent_count: 1
  max_steps: 4608
  seed: 9996
  trail_mode: false
  task:
    max_consecutive_collisions: 10
  geometry:
    extent: [4096, 2048, 512]
    compiled_world_path: runtime/obstacle-waypoint-pilot/worlds/ed3f7cf6a2ab67d5d9bb82537bfa8fa50638a599cabc7ded2213fd4c3cc20c05
  observation:
    mode: box
    box_radius: 1
  action:
    mode: discrete_18
  rewards:
    step_cost: -0.01
    collision_cost: 0.0
    goal_reward: 1.0
    distance_shaping: 0.2
    distance_reward_mode: progress
  waypoint_curriculum:
    enabled: true
    completion_mode: continue_route
    initial_start: [1, 1024, 256]
    initial_goal: [3, 1024, 256]
    seed: 42
    routes:
      - {start: [1, 1024, 256], waypoints: [[3, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[5, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[9, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[17, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[33, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[65, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[129, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[257, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[513, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[1025, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[2049, 1024, 256]]}
      - {start: [1, 1024, 256], waypoints: [[4095, 1024, 256], [4095, 1026, 256]]}
    training_sampling:
      strategy: inverse_success
      minimum_weight: 0.5
      power: 1.0
      unevaluated_success_rate: 0.0
    advance:
      mode: success
      successes_required: 1

training:
  algorithm: ppo
  model: voxel_encoder
  runner: local
  iterations: 2
  checkpoint_interval: 1
  require_gpu: true
  num_gpus: 0.3333333333333333
  num_env_runners: 0
  num_envs_per_env_runner: 1
  trajectory_every: 10
  best_trajectory: false
  video_every: 0

evaluation:
  episodes: 1
  seed: 142
  min_success_rate: 0.8
  num_env_runners: 0
  num_envs_per_env_runner: 1
  waypoint_curriculum:
    enabled: true
    frequency: 10
    stages: all
    episodes: 1
    min_success_rate: 0.8
    min_per_stage_success_rate: 1.0
    advance:
      mode: success
      successes_required: 1

imitation:
  enabled: true
  strategy: pretrain_then_rl
  generation:
    provider: replanning_astar
    episodes: 12
    max_attempts: 12
    require_success: true
  sampling:
    provider: uniform_transition
  collection:
    seed_start: 1000
    validation_fraction: 0.08333333333333333
    reuse_dataset: false
    curriculum_stages: all
    dataset_dir: runtime/train/large_world_six_gate_imitation_smoke/dataset
  pretraining:
    epochs: 2
    batch_size: 256
    learning_rate: 0.0003
    label_smoothing: 0.0
    early_stopping_patience: 2
  handoff:
    initialize_encoder: true
    initialize_policy: true
    initialize_value_head: false

algorithm_config:
  lr: 3.2758116123493746e-06
  train_batch_size: 1024
  gamma: 0.9553965963523646
  clip_param: 0.17433888871735448
  kl_coeff: 0.055248848244078094
  num_sgd_iter: 3
  minibatch_size: 256
  lambda_: 0.8859247630340334

model_config:
  hidden_sizes: [512, 256, 128]
  activation: relu

mlflow:
  tracking_uri: sqlite:///runtime/experiments/mlflow.db
