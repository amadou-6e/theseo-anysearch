description: >
  Trains DQN on augmented geometry-pool maps using radial observations and negative zone-based distance rewards. It provides an off-policy discrete-action comparison to the PPO maps configuration.

experiment:
  name: dqn-maps-zones
  output_dir: ../../../runtime/experiments
  seed: 42

env:
  agent_count: 1
  max_steps: 300
  trail_mode: true

  geometry:
    grid_size: 32
    pool:
      pool_dir: ../../../runtime/geometry_pools/preview
      augmentation:
        paste_boxes:
          num_boxes: [1, 4]
          box_min_size: [1, 1, 1]
          box_max_size: [5, 5, 5]
          prob: 0.5

  observation:
    mode: radial

  rewards:
    goal_reward: 10.0
    collision_cost: -0.5
    distance_reward_mode: zone
    zone_reward_min: -1.0
    zone_reward_max: -0.01
    zone_reward_curve: linear

training:
  algorithm: dqn
  runner: local
  iterations: 100
  checkpoint_interval: 25
  trajectory_every: 10
  best_trajectory: true

algorithm_config:
  lr: 3.0e-4
  gamma: 0.99
  train_batch_size: 64
  n_step: 1
  num_atoms: 1
  dueling: true
  double_q: true
  noisy: false
  replay_buffer_capacity: 50000
  warmup_steps: 512

model_config:
  hidden_sizes: [256, 256]
  activation: relu

mlflow: {}
