description: >
  Runs Dijkstra search as a standalone voxel-navigation baseline. It guarantees a shortest path when one exists and writes a replayable trajectory without training a neural policy.

experiment:
  name: dijkstra
  output_dir: ../../../../runtime/experiments
  seed: 42

env:
  agent_count: 1
  max_steps: 96
  trail_mode: true

  geometry:
    stl_path: usage/geometries/cube.stl
    scale: 40.0

training:
  algorithm: heuristic
  runner: local

heuristic:
  enabled: true
  type: dijkstra


mlflow: {}
