description: >
  Composes an STL room with a typed box obstacle using env.geometry.sources.
  Inspect and validate this experiment without starting Ray:

    anysearch geometry inspect usage/experiments/showcase/geometry_capabilities/01_composed_sources/experiment.yaml
    anysearch geometry validate usage/experiments/showcase/geometry_capabilities/01_composed_sources/experiment.yaml --json

experiment:
  name: geometry-capabilities-composed-sources
  output_dir: runtime/geometry_capabilities/01_composed_sources
  seed: 42

env:
  max_steps: 256
  seed: 42
  agent_count: 1
  trail_mode: false
  waypoints_file: waypoints.json
  geometry:
    grid_size: 32
    sources:
      - type: stl
        path: usage/geometries/corridor_l.stl
        scale: 24.0
        padding: 2
      - type: boxes
        boxes:
          - [12, 20, 4, 14, 22, 6]
    validation:
      enabled: true
      maximum_attempts: 1
      maximum_search_nodes: 100000
      recovery_margin_steps: 8
  observation:
    mode: box
    box_radius: 1
  action:
    mode: discrete_6
    behavior: cursor_navigation
    predicates:
      - valid_action
      - bounds
      - unoccupied
    outcomes:
      - cursor_movement
    history_length: 8
  rewards:
    step_cost: -0.01
    goal_reward: 1.0
    distance_shaping: 0.05
    distance_reward_mode: progress

training:
  algorithm: ppo
  runner: local
  iterations: 5
  require_gpu: false
  num_env_runners: 1
  trajectory_every: 1

evaluation:
  episodes: 2
  seed: 42
  num_env_runners: 1

algorithm_config:
  lr: 0.001
  train_batch_size: 512
  minibatch_size: 128
  num_sgd_iter: 4

model_config:
  hidden_sizes: [64, 64]
  activation: relu
