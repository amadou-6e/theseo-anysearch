description: >
  A geometry.py sibling provides the Python reference `wall` provider; a
  compiled Rust export in extension/ mirrors it exactly (see
  compare_providers.py). anysearch geometry inspect/validate/sample only
  reach the Python path here -- geometry.py's presence takes discovery
  precedence over the compiled native export, the same way it does for the
  environment at runtime. Run:

    anysearch geometry validate usage/experiments/showcase/geometry_capabilities/04_native_provider/experiment.yaml --json

  To compare the Python and native providers directly (ABI discovery,
  identical canonical output, deterministic enforcement, malformed-provider
  diagnostics), run:

    python usage/experiments/showcase/geometry_capabilities/04_native_provider/compare_providers.py

experiment:
  name: geometry-capabilities-native-provider
  output_dir: runtime/geometry_capabilities/04_native_provider
  seed: 42

env:
  max_steps: 128
  seed: 42
  agent_count: 1
  trail_mode: false
  waypoints_file: waypoints.json
  geometry:
    grid_size: 32
    provider:
      name: wall
      parameters:
        wall_x: 16
        gap_z: 8
    validation:
      enabled: true
      maximum_attempts: 1
      maximum_search_nodes: 100000
      recovery_margin_steps: 8
  observation:
    mode: box
    box_radius: 1
  action:
    mode: discrete_6
    behavior: cursor_navigation
    predicates:
      - valid_action
      - bounds
      - unoccupied
    outcomes:
      - cursor_movement
    history_length: 8
  rewards:
    step_cost: -0.01
    goal_reward: 1.0
    distance_shaping: 0.05
    distance_reward_mode: progress

training:
  algorithm: ppo
  runner: local
  iterations: 5
  require_gpu: false
  num_env_runners: 1
  trajectory_every: 1

evaluation:
  episodes: 2
  seed: 42
  num_env_runners: 1

algorithm_config:
  lr: 0.001
  train_batch_size: 512
  minibatch_size: 128
  num_sgd_iter: 4

model_config:
  hidden_sizes: [64, 64]
  activation: relu
