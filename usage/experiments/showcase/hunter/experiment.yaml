description: >
  Demonstrates a hunter movement policy built from experiment-local Rust action
  extensions. Every accepted action moves exactly two voxels in the selected
  direction; a custom predicate rejects moves whose doubled destination leaves
  the grid.

experiment:
  name: hunter-extension-demo
  output_dir: runtime/hunter_extension_demo
  seed: 42

env:
  waypoints_file: usage/experiments/showcase/hunter/waypoints.json
  max_steps: 50
  seed: 42
  agent_count: 1
  trail_mode: false
  geometry:
    grid_size: 32
  observation:
    mode: box
    box_radius: 2
  action:
    mode: discrete_26
    behavior: cursor_navigation
    predicates:
      - valid_action
      - name: double_step_in_bounds
        parameters:
          multiplier: 2
    outcomes:
      - name: double_step
        parameters:
          multiplier: 2
    history_length: 8
  rewards:
    step_cost: 0.0
    collision_cost: 0.0
    goal_reward: 1.0
    distance_shaping: 0.0

training:
  algorithm: ppo
  runner: local
  iterations: 1
  require_gpu: false
  num_env_runners: 1
  trajectory_every: 1

evaluation:
  episodes: 1
  seed: 42
  num_env_runners: 1

algorithm_config:
  lr: 0.001
  train_batch_size: 256
  minibatch_size: 64
  num_sgd_iter: 2

model_config:
  hidden_sizes: [64, 64]
  activation: relu