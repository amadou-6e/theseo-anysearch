description: >
  Progressively trains DQN to select an adjacent waypoint, navigate to
  increasingly distant goals, solve the full-length episode, and finally
  handle trail placement.

experiment:
  name: staged-waypoint-dqn
  output_dir: runtime/showcase
  seed: 42

env:
  agent_count: 1
  max_steps: 1
  seed: 42
  trail_mode: false
  waypoints_file: usage/experiments/showcase/staged_waypoint_training/waypoint_adjacent.json
  geometry:
    grid_size: 32
    boxes: []
  observation:
    mode: box
    box_radius: 1
  action:
    mode: discrete_26
  rewards:
    step_cost: -0.01
    collision_cost: -0.10
    goal_reward: 1.0
    distance_shaping: 0.10

training:
  algorithm: dqn
  model: voxel_encoder
  runner: local
  iterations: 500
  checkpoint_interval: 10
  require_gpu: false
  num_env_runners: 2
  num_envs_per_env_runner: 4
  trajectory_every: 10
  best_trajectory: true

evaluation:
  episodes: 20
  seed: 142
  min_success_rate: 0.8
  num_env_runners: 1

algorithm_config:
  lr: 3.0e-4
  gamma: 0.99
  train_batch_size: 512
  n_step: 1
  dueling: true
  double_q: true
  replay_buffer_type: uniform
  replay_buffer_capacity: 100000
  warmup_steps: 1000

model_config:
  hidden_sizes: [128, 128, 128]
  activation: relu

staging:
  enabled: true
  resume: true
  replay_transition: clear
  stages:
    - name: select-adjacent-goal
      completion:
        type: iterations
        iterations: 25
      env:
        max_steps: 1
        trail_mode: false
        waypoints_file: usage/experiments/showcase/staged_waypoint_training/waypoint_adjacent.json

    - name: reach-near-goal
      completion:
        type: iterations
        iterations: 50
      env:
        max_steps: 8
        trail_mode: false
        waypoints_file: usage/experiments/showcase/staged_waypoint_training/waypoint_near.json

    - name: reach-medium-goal
      completion:
        type: iterations
        iterations: 100
      env:
        max_steps: 32
        trail_mode: false
        waypoints_file: usage/experiments/showcase/staged_waypoint_training/waypoint_medium.json

    - name: full-episode-no-trails
      completion:
        type: iterations
        iterations: 150
      env:
        max_steps: 96
        trail_mode: false
        waypoints_file: usage/experiments/showcase/staged_waypoint_training/waypoint_full.json

    - name: full-episode-with-trails
      completion:
        type: any
        max_iterations: 175
        conditions:
          - type: performance
            metric: evaluation_success_rate
            threshold: 0.95
            comparison: gte
            consecutive_iterations: 5
      replay_transition: clear
      env:
        max_steps: 128
        trail_mode: true
        waypoints_file: usage/experiments/showcase/staged_waypoint_training/waypoint_full.json
