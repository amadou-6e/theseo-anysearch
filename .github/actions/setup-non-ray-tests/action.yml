name: Set up non-Ray tests
description: Install Python dependencies and the shared theseo_core wheel.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: Download Rust wheel
      uses: actions/download-artifact@v6
      with:
        name: theseo-core-wheel
        path: dist

    - name: Install project and test dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install --editable ".[dev,torch-cpu]"
        $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
        python -m pip install $wheel.FullName
