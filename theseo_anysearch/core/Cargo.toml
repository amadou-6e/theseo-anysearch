[package]
name = "theseo-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "theseo_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "theseo-viewer"
path = "src/main.rs"

[[bin]]
name = "voxel-replay"
path = "src/bin/voxel_replay.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
glam = "0.29"
pyo3 = { version = "0.28", features = ["extension-module"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
