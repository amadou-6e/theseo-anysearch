# Garden preset: r1 — radius 1, 3×3×3 local patch (~100k params)
#
# Smallest granularity. Encodes only the immediate voxel neighbourhood
# (±1 cell = 3 cells per axis). Fast to train; use when the agent needs
# a lightweight "am I about to collide" signal.
#
# Train: anysearch garden train r1 --tag v1
# Use:   pretrained_encoder: r1:v1
name: r1
approach: autoencoder
architecture: voxel_box_3dcnn

data:
  sources:
    - type: position_sample
      geometry:
        sampler:
          type: random_boxes
          num_geometries: 150
          num_boxes: [1, 8]
          box_min_size: [2, 2, 2]
          box_max_size: [10, 10, 10]
          grid_size: 32
          total_samples: 30000
  split:
    val_fraction: 0.1
  min_fill_pct: 2.0

encoder:
  box_radius: 1
  conv_channels: [16, 32]
  latent_dim: 32

augmentation:
  rotate90: true
  flip: true
  noise_prob: 0.05
  translation_jitter: 1
  morph_prob: 0.15
  cutout:
    count: 1
    min_size: 1
    max_size: 1

training:
  epochs: 50
  batch_size: 256
  lr: 3.0e-4
  lr_scheduler: cosine
  early_stop_patience: 12
  focal_gamma: 2.0
