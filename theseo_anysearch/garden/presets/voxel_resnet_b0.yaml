# Compact reference model for the compound-scaled voxel ResNet family.
# Train: anysearch garden train voxel_resnet_b0 --tag v1
name: voxel_resnet_b0
approach: autoencoder
architecture: voxel_resnet_3d

data:
  sources:
    - type: position_sample
      geometry:
        sampler:
          type: random_boxes
          num_geometries: 150
          num_boxes: [1, 8]
          box_min_size: [2, 2, 2]
          box_max_size: [14, 14, 14]
          grid_size: 32
          total_samples: 50000
  split:
    val_fraction: 0.1
  min_fill_pct: 2.0

encoder:
  profile: b0
  box_radius: 2
  conv_channels: [24, 48, 64]
  latent_dim: 64

augmentation:
  rotate90: true
  flip: true
  noise_prob: 0.05
  translation_jitter: 1
  morph_prob: 0.2
  cutout:
    count: 2
    min_size: 1
    max_size: 2

training:
  epochs: 100
  batch_size: 128
  lr: 3.0e-4
  lr_scheduler: cosine
  early_stop_patience: 20
  focal_gamma: 2.0
