# Smallest production member of the spatial voxel ResNet family.
# Selected by the 100-trial gpu-v6 width/depth/latent search.
# Train: anysearch garden train voxel_resnet_s0 --tag v1
name: voxel_resnet_s0
approach: autoencoder
architecture: voxel_resnet_3d

data:
  sources:
    - type: position_sample
      geometry:
        sampler:
          type: random_boxes
          num_geometries: 150
          num_boxes: [1, 8]
          box_min_size: [2, 2, 2]
          box_max_size: [14, 14, 14]
          grid_size: 32
          total_samples: 50000
  split:
    val_fraction: 0.1
  min_fill_pct: 2.0

encoder:
  profile: s0
  pooling: spatial_2x2x2
  box_radius: 2
  conv_channels: [20, 40, 56]
  residual_blocks: [1, 1, 1]
  latent_dim: 48

augmentation:
  rotate90: true
  flip: true
  noise_prob: 0.025
  translation_jitter: 1
  morph_prob: 0.1
  cutout:
    count: 1
    min_size: 1
    max_size: 2

training:
  epochs: 20
  batch_size: 64
  optimizer: adam
  lr: 2.4987691221397e-4
  weight_decay: 1.00939331034141e-3
  lr_scheduler: cosine
  early_stop_patience: 8
  focal_gamma: 0.0
  dice_weight: 0.5
  face_loss_weight: 0.1
  loss_version: positive_bce_v2
