# GPU optimization search for the fixed B0 architecture and reconstruction objective.
# Run: anysearch garden tune voxel_resnet_b0_tune --tag gpu-v1
name: voxel_resnet_b0_tuned
approach: autoencoder
architecture: voxel_resnet_3d

data:
  sources:
    - type: position_sample
      geometry:
        sampler:
          type: random_boxes
          num_geometries: 150
          num_boxes: [1, 8]
          box_min_size: [2, 2, 2]
          box_max_size: [14, 14, 14]
          grid_size: 32
          total_samples: 50000
  split:
    val_fraction: 0.1
  min_fill_pct: 2.0

encoder:
  profile: b0
  box_radius: 2
  conv_channels: [24, 48, 64]
  latent_dim: 64

augmentation:
  rotate90: true
  flip: true
  noise_prob: 0.05
  translation_jitter: 1
  morph_prob: 0.2
  cutout:
    count: 2
    min_size: 1
    max_size: 2

training:
  epochs: 20
  batch_size: 256
  optimizer: adam
  lr: 3.0e-4
  weight_decay: 0.0
  lr_scheduler: cosine
  early_stop_patience: 10
  focal_gamma: 2.0
  loss_version: positive_bce_v2

tune:
  num_samples: 8
  max_concurrent: 1
  grace_period: 4
  reduction_factor: 3
  search_space:
    training:
      optimizer: {choice: [adam, adamw, rmsprop]}
      lr: {loguniform: [1.0e-5, 2.0e-3]}
      weight_decay: {loguniform: [1.0e-7, 1.0e-3]}
      batch_size: {choice: [128, 256, 512]}
