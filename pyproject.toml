[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theseo-anysearch"
version = "0.1.0"
requires-python = ">=3.10"   # Ray/RLlib wheels require <=3.12 for full installs
dependencies = [
    # Core ML / RL
    "numpy>=2.0.0",
    "ray[rllib]>=2.9",

    # Config + validation
    "pydantic>=2.0",
    "pyyaml>=6.0",

    # CLI
    "typer>=0.12",
    "rich>=13.0",               # typer rich output

    # Environments
    "gymnasium>=0.29",
    "pettingzoo>=1.24",

    # Experiment tracking
    "mlflow>=2.13",

    # Artifact storage (cloud-agnostic)
    "fsspec>=2024.2",

    # Trajectory serialisation
    "protobuf>=4.25",
]

[project.optional-dependencies]
# pip: pip install .[torch-cpu] --index-url https://download.pytorch.org/whl/cpu
torch-cpu = ["torch>=2.0"]
# pip: pip install .[torch-gpu] --index-url https://download.pytorch.org/whl/cu124
# uv:  uv sync --extra torch-gpu  (uses [tool.uv.sources] below)
torch-gpu = ["torch>=2.0"]

# Cloud storage backends — install as needed
cloud-s3 = ["s3fs>=2024.2"]
cloud-gcs = ["gcsfs>=2024.2"]
cloud-azure = ["adlfs>=2024.2"]

# Dev / test
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
anysearch = "theseo_anysearch.cli.main:app"

# uv resolves torch from the CUDA/CPU wheel servers when the matching extra is active.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "torch-gpu" },
    { index = "pytorch-cpu",   extra = "torch-cpu"  },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url  = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "core*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
cache_dir = "pytest_tmp_root/cache"
timeout = 90
timeout_method = "thread"
markers = [
    "ray: marks tests that require ray[rllib] and torch",
    "e2e: marks end-to-end tests that require theseo_core wheel",
    "integration: alias for e2e (legacy)",
]
