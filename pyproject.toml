[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theseo-anysearch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0.0",
  "networkx>=3.2",
  "ray[default,rllib]>=2.9",
  "aiohttp>=3.9",
  "opencensus>=0.11",
  "opentelemetry-exporter-otlp>=1.34",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "gymnasium>=0.29",
  "pettingzoo>=1.24",
  "mlflow>=2.13",
  "tensorboard>=2.17",
  "plotly>=5.22",
  "psutil>=5.9",
  "fsspec>=2024.2",
  "protobuf>=4.25",
]

[project.optional-dependencies]
cloud-azure = ["adlfs>=2024.2"]
cloud-gcs = ["gcsfs>=2024.2"]
cloud-s3 = ["s3fs>=2024.2"]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
]
torch-cpu = ["torch>=2.0"]
torch-gpu = ["torch>=2.0"]

[project.scripts]
anysearch = "theseo_anysearch.cli.main:app"

[tool.setuptools.packages.find]
include = ["theseo_anysearch*"]

[tool.setuptools.package-data]
theseo_anysearch = [
  "extension_sdk/Cargo.toml",
  "extension_sdk/Cargo.lock",
  "extension_sdk/src/*.rs",
  "extension_sdk/macros/Cargo.toml",
  "extension_sdk/macros/src/*.rs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["pytest_tmp_root", "runtime", "experiments", "mlruns", ".worktrees", "build", "dist"]
markers = [
  "integration: exercises multiple runtime components or external processes",
  "ray: starts or requires a real Ray runtime and is excluded from fast CI",
]
